  - {id: fedreg_presidential_docs, source: fedreg, code: presidential_documents, name: "Presidential documents published per week", dimension: political_institutional, lens: conditions, unit: "count", frequency: weekly}
  - {id: fedreg_rules,            source: fedreg, code: rules,                  name: "Final rules published per week",            dimension: political_institutional, lens: conditions, unit: "count", frequency: weekly}

