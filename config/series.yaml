  # ---------------------------------------------------------------- GDELT GKG (BigQuery): share and tone of English news about the US, by dimension (from 2015)
  - {id: gkg_share_cost_of_living,   source: gdelt_gkg, code: "share:cost_of_living",   name: "News share: prices, inflation, fuel, housing costs", dimension: cost_of_living,          lens: attention, unit: "percent of US coverage", frequency: daily}
  - {id: gkg_tone_cost_of_living,    source: gdelt_gkg, code: "tone:cost_of_living",    name: "News tone: cost of living coverage",               dimension: cost_of_living,          lens: attention, unit: "avg tone", frequency: daily}
  - {id: gkg_share_jobs_financial,   source: gdelt_gkg, code: "share:jobs_financial",   name: "News share: jobs, markets, rates, debt",            dimension: jobs_financial,          lens: attention, unit: "percent of US coverage", frequency: daily}
  - {id: gkg_tone_jobs_financial,    source: gdelt_gkg, code: "tone:jobs_financial",    name: "News tone: jobs and financial coverage",            dimension: jobs_financial,          lens: attention, unit: "avg tone", frequency: daily}
  - {id: gkg_share_political,        source: gdelt_gkg, code: "share:political",        name: "News share: political crisis, scandal, shutdown",   dimension: political_institutional, lens: attention, unit: "percent of US coverage", frequency: daily}
  - {id: gkg_tone_political,         source: gdelt_gkg, code: "tone:political",         name: "News tone: political crisis coverage",              dimension: political_institutional, lens: attention, unit: "avg tone", frequency: daily}
  - {id: gkg_share_safety_unrest,    source: gdelt_gkg, code: "share:safety_unrest",    name: "News share: violence, protest, extremism",          dimension: safety_unrest,           lens: attention, unit: "percent of US coverage", frequency: daily}
  - {id: gkg_tone_safety_unrest,     source: gdelt_gkg, code: "tone:safety_unrest",     name: "News tone: violence and unrest coverage",           dimension: safety_unrest,           lens: attention, unit: "avg tone", frequency: daily}
  - {id: gkg_share_disasters_health, source: gdelt_gkg, code: "share:disasters_health", name: "News share: disasters, outbreaks, emergencies",     dimension: disasters_health,        lens: attention, unit: "percent of US coverage", frequency: daily}
  - {id: gkg_tone_disasters_health,  source: gdelt_gkg, code: "tone:disasters_health",  name: "News tone: disaster and health coverage",           dimension: disasters_health,        lens: attention, unit: "avg tone", frequency: daily}
  - {id: gkg_share_geopolitical,     source: gdelt_gkg, code: "share:geopolitical",     name: "News share: armed conflict, WMD, sanctions, terrorism (all English coverage)", dimension: geopolitical, lens: attention, unit: "percent of English coverage", frequency: daily}
  - {id: gkg_tone_geopolitical,      source: gdelt_gkg, code: "tone:geopolitical",      name: "News tone: conflict coverage",                      dimension: geopolitical,            lens: attention, unit: "avg tone", frequency: daily}
  - {id: gkg_share_boycott,          source: gdelt_gkg, code: "share:boycott",          name: "News share: boycotts",                              dimension: validation,              lens: attention, unit: "percent of US coverage", frequency: daily, notes: "Outcome proxy"}
  - {id: gkg_tone_us_all,            source: gdelt_gkg, code: "tone:us_all",            name: "Average tone of all US news coverage",               dimension: validation,              lens: attention, unit: "avg tone", frequency: daily, notes: "Overall negativity"}
  - {id: gkg_base_us,                source: gdelt_gkg, code: "base:us",                name: "Articles about the US (English originals)",          dimension: validation,              lens: attention, unit: "articles", frequency: daily, notes: "Denominator"}

  # ---------------------------------------------------------------- DOL: weekly unemployment claims (national, not seasonally adjusted)
  - {id: dol_initial_claims_nsa,   source: dol, code: initial,   name: "Initial unemployment claims (NSA, sum of states)",   dimension: jobs_financial, lens: conditions, unit: "claims", frequency: weekly, sa: NSA}
  - {id: dol_continued_claims_nsa, source: dol, code: continued, name: "Continued unemployment claims (NSA, sum of states)", dimension: jobs_financial, lens: conditions, unit: "claims", frequency: weekly, sa: NSA}

  # ---------------------------------------------------------------- Treasury yields (daily)
  - {id: ust_2y,       source: treasury, code: "nominal:BC_2YEAR",  name: "Treasury 2-year yield",        dimension: jobs_financial, lens: sentiment, unit: "percent", frequency: daily, notes: "Fed-path expectations"}
  - {id: ust_10y,      source: treasury, code: "nominal:BC_10YEAR", name: "Treasury 10-year yield",       dimension: jobs_financial, lens: sentiment, unit: "percent", frequency: daily}
  - {id: ust_3m,       source: treasury, code: "nominal:BC_3MONTH",  name: "Treasury 3-month yield",       dimension: jobs_financial, lens: sentiment, unit: "percent", frequency: daily, notes: "10y minus 3m = yield-curve recession signal"}
